spring.application.name=ats-checker

# H2 Database Connection Settings (File-based — persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/ats_checker;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# -----------------------------------------------
# Google Gemini AI Configuration
# Get your FREE key at: https://aistudio.google.com/apikey
# Paste it below and restart the server to enable AI features
# -----------------------------------------------
gemini.api.key=
gemini.enabled=true
