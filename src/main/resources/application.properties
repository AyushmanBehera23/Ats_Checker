spring.application.name=ats-checker
server.port=${PORT:8080}

# Database Settings (Dynamic: Cloud Postgres / MySQL / Local H2 Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ats_checker;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.enabled=true
